<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Results — ResumeLens</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <aside class="sidebar">
    <nav class="sidebar-nav">
      <a href="index.html" class="side-item" data-label="Dashboard">
        <i class="fas fa-house"></i>
        <span>Dashboard</span>
      </a>
      <a href="#" class="side-item" data-label="Profile">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
      <a href="#" class="side-item active" data-label="Resumes">
        <i class="fas fa-file-lines"></i>
        <span>Resumes</span>
      </a>
      <a href="#" class="side-item" data-label="Analytics">
        <i class="fas fa-chart-simple"></i>
        <span>Analytics</span>
      </a>
      <a href="#" class="side-item" data-label="Insights">
        <i class="fas fa-chart-pie"></i>
        <span>Insights</span>
      </a>
      <a href="#" class="side-item" data-label="Settings">
        <i class="fas fa-gear"></i>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-dots"><span></span><span></span><span></span></div>
  </aside>

  <div class="page">
    <section class="results-page">
      <nav>
        <div class="logo">
          <div class="logo-icon-wrapper">
            <img src="images/logo.png" alt="ResumeLens" class="logo-img">
          </div>
          <div class="logo-text">
            <h2>Resume<span>Lens</span></h2>
            <small>AI ATS RESUME ANALYZER</small>
          </div>
        </div>
        <a href="index.html" class="back-link">← Analyze another resume</a>
      </nav>

      <div class="dashboard" id="dashboard">
        <div class="dashboard-content">
          <div class="dashboard-header">
            <div>
              <small>RESUME ANALYSIS</small>
              <b id="resumeName">Your Resume</b>
            </div>
          </div>

          <div class="cards">
            <div class="card">
              <small>ATS MATCH SCORE</small>
              <div class="score"><span id="scoreValue">--</span><span>/100</span></div>
              <div class="success" id="scoreMessage"></div>
            </div>

            <div class="card">
              <small>MATCHING SKILLS</small>
              <div class="skill-list" id="matchedSkills"></div>
            </div>
          </div>

          <div class="keywords">
            <small>MISSING SKILLS</small>
            <div id="missingSkills"></div>
          </div>

          <div class="suggestions">
            <small>SUGGESTIONS TO IMPROVE</small>
            <ul id="suggestionsList"></ul>
          </div>
        </div>
      </div>

      <p class="loading-note" id="loadingNote">Loading your results...</p>
    </section>
  </div>

  <script src="results.js"></script>
</body>
</html>
